[project]
name = "carbonsight-data-engine"
version = "1.0.0"
description = "Live biomass and Sentinel-2 carbon estimates for a GeoJSON polygon."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "numpy>=1.26",
  "rasterio>=1.3",
  "shapely>=2",
  "pyproj>=3.6",
  "pystac-client>=0.7",
  "planetary-computer>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: calls Planetary Computer and the ESA CCI archive"]

[tool.setuptools.packages.find]
include = ["carbonsight*"]
